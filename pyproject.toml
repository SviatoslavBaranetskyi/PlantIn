[project]
name = "duplicate-image-service"
version = "0.1.0"
description = "Service for duplicate image detection"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "pydantic-settings>=2.10.0",
    "python-multipart>=0.0.20",

    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "pillow>=11.3.0",

    "qdrant-client==1.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "httpx>=0.28.0",
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"